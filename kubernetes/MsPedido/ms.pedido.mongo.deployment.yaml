apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-pedido
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-pedido
  template:
    metadata:
      labels:
        app: mongodb-pedido
    spec:
      containers:
        - name: mongodb-pedido
          image: mongodb/mongodb-community-server:6.0-ubi8
          ports:
            - containerPort: 27017
          env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: username
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: password
          - name: MONGO_INITDB_DATABASE
            value: "ms-pedido"